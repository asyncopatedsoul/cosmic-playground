[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
# `cargo test` / `cargo build` at the root skip the desktop shell (it pulls in Tauri).
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
