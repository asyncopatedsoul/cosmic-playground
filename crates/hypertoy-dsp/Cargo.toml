[package]
name = "hypertoy-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# No fft or file I/O. `std` because 0.23's no_std build is broken (resample.rs lacks `vec!`);
# wasm32-unknown-unknown has std, so nothing is lost.
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }
